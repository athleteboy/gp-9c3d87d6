<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ジャイロ投稿</title>
<meta name="theme-color" content="#15202b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="投稿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --ground:#f3f5f8; --surface:#fff; --ink:#15202b; --muted:#5b6876; --line:#dfe4ea;
  --accent:#1d6fd8; --accent-ink:#fff; --ok:#1a8a55; --ok-bg:#e3f4ea; --warn:#b4540b;
  --sans:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0f141a; --surface:#18202a; --ink:#e8edf2; --muted:#9aa7b4; --line:#2a3542;
    --accent:#4d93ec; --accent-ink:#0b1219; --ok:#5fd09a; --ok-bg:#153324; --warn:#f0a35c;
  }
}
:root[data-theme="dark"]{
  --ground:#0f141a; --surface:#18202a; --ink:#e8edf2; --muted:#9aa7b4; --line:#2a3542;
  --accent:#4d93ec; --accent-ink:#0b1219; --ok:#5fd09a; --ok-bg:#153324; --warn:#f0a35c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;gap:12px}
.top{position:sticky;top:0;z-index:3;background:var(--ground);padding:calc(env(safe-area-inset-top,0px) + 8px) 0 8px;margin-top:calc(-8px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px}
.days{display:flex;gap:6px;flex:1;overflow-x:auto}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px}
.day.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.icon{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.prog b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.meter{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.next{border:2px solid var(--accent)}
.card.done{opacity:.55}
.ch{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;min-width:48px}
.tm.none{color:var(--muted);font-weight:400;font-size:14px}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.gen{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.one{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.chk{font-size:13px;color:var(--ok);font-weight:700;white-space:nowrap}
.cb{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.thumbs{display:grid;grid-template-columns:1fr;gap:6px}
.thumbs.n2{grid-template-columns:1fr 1fr}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--line)}
.big{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 8px env(safe-area-inset-bottom,0px)}
.big img{max-width:100%;max-height:100%;object-fit:contain}
.seg{border-left:3px solid var(--accent);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.seg .sl{font-size:12px;font-weight:700;color:var(--muted)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.txt.fold{max-height:5.2em;overflow:hidden;position:relative}
.txt.fold::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2em;background:linear-gradient(transparent,var(--surface))}
.more{align-self:flex-start;border:0;background:none;color:var(--accent);font:inherit;font-size:14px;padding:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.sub{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500;font-size:15px}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.undo{background:transparent;color:var(--ok);border-color:var(--ok)}
.msg{font-size:13px;color:var(--ok);min-height:1em}
.ln.mk{border-radius:4px}
.ln.k0{background:color-mix(in srgb,#f0b400 35%,transparent)}
.ln.k1{background:color-mix(in srgb,#e5484d 35%,transparent)}
.ln.k2{background:color-mix(in srgb,#3e8ef7 35%,transparent)}
.ln.mk::after{content:" " attr(data-k);font-size:11px;font-weight:700;color:var(--warn)}
.hint{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px}
.chip.on{background:var(--warn);border-color:var(--warn);color:#fff}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sheetin{background:var(--surface);width:100%;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheetln{font-size:14px;color:var(--muted);white-space:pre-wrap;padding-bottom:4px}
.btn.on{outline:3px solid var(--accent)}
.ln.sel{outline:2px solid var(--accent);outline-offset:2px;background:color-mix(in srgb,var(--accent) 25%,transparent);border-radius:4px}
.note{width:100%;min-height:64px;font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}
.ln.k3{background:color-mix(in srgb,#8b8d98 40%,transparent);text-decoration:line-through}
.when{font-size:15px;font-weight:700;color:var(--accent)}
.qsrc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--ground)}
.qsrc .txt.fold::after{background:linear-gradient(transparent,var(--ground))}
a.more{text-decoration:none}
.sec2{font-size:15px;font-weight:800;margin-top:4px}
.xcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--ground)}
.xwho{font-size:15px}.xwho span{color:var(--muted)}
.xmeta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.msg.err{color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:14px;font-size:15px}
.login{display:flex;flex-direction:column;gap:12px;padding-top:20vh}
.login input{font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}
.foot{font-size:12px;color:var(--muted);text-align:center}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $ = (t,a={},k=[])=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==='class')e.className=v;else if(n==='text')e.textContent=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else e.setAttribute(n,v)}(Array.isArray(k)?k:[k]).forEach(c=>c&&e.appendChild(typeof c==='string'?document.createTextNode(c):c));return e};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const WD='日月火水木金土';
const md=d=>{const t=new Date(d+'T00:00:00');return (t.getMonth()+1)+'/'+t.getDate()+'('+WD[t.getDay()]+')'};
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null, IDX=null, DAY=null, FILES={}, open={};
let done=LS.get('gp_done',{});   // id -> 投稿した時刻

async function derive(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt','encrypt']);
}
async function getBin(f){
  const r=await fetch('data/'+f); if(!r.ok) throw new Error('取れない '+f);
  const u=new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12));
}
async function loadIndex(){
  const r=await fetch('data/index.json?t='+Date.now(),{cache:'no-store'}).catch(()=>fetch('data/index.json'));
  return r.json();
}

function login(err){
  const app=document.getElementById('app'); app.textContent='';
  const inp=$('input',{type:'password',placeholder:'合言葉',autocomplete:'current-password',id:'pass'});
  const go=$('button',{class:'btn',text:'開く',onclick:async()=>{
    go.disabled=true; msg.textContent='確かめています…';
    try{ await start(inp.value.trim()); }catch(e){ go.disabled=false; msg.className='msg err'; msg.textContent='合言葉が違うか、つながりません'; }
  }});
  const msg=$('div',{class:'msg'+(err?' err':''),text:err||''});
  app.append($('div',{class:'login'},[$('h1',{text:'ジャイロ投稿',style:'margin:0;font-size:22px'}),$('div',{text:'最初の1回だけ合言葉を入れてください',style:'color:var(--muted);font-size:14px'}),inp,go,msg]));
}

async function start(pass){
  IDX=await loadIndex();
  KEY=await derive(pass,IDX.salt,IDX.iter);
  const t=today(); const ds=Object.keys(IDX.days).sort().filter(d=>d>=t);
  DAY = LS.get('gp_day',null); if(!ds.includes(DAY)) DAY = ds.includes(t)?t:ds[0];
  await loadDay();
  LS.set('gp_pass',pass);
  if(IDX.cfg){ try{ CFG=JSON.parse(new TextDecoder().decode(await getBin(IDX.cfg))); sendMarks(); render(); }catch(e){} }
}
let LEFT=[], leftOpen=false, MODE=LS.get('gp_mode','single'), SINGLES=[], QUOTES=[], MOVE=LS.get('gp_move',{});
const QS=new URLSearchParams(location.search);
if(QS.get('tab')){ MODE=QS.get('tab'); LS.set('gp_mode',MODE); if(QS.get('id')) open[QS.get('id')]=true; }
navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',e=>{ const o=e.data&&e.data.open; if(!o) return; MODE=o.tab||MODE; LS.set('gp_mode',MODE); if(o.id) open[o.id]=true; if(IDX) loadIndex().then(n=>{IDX=n;return loadDay();}); });
async function loadDay(){
  const d=IDX.days[DAY], q=(IDX.quotes||{})[DAY];
  // 本人「今日投稿できなかったものを明日に回したい」：全部の日を読み、回した物・前日の残りを足す（MOVE＝id→回した日 or 'drop'）
  const ALL={};
  for(const [dd,v] of Object.entries(IDX.days)){ try{ ALL[dd]=JSON.parse(new TextDecoder().decode(await getBin(v.f))).map(x=>({...x,_from:dd})); }catch(e){ ALL[dd]=[]; } }
  const yday=Object.keys(ALL).filter(x=>x<DAY).sort().pop();
  SINGLES=[]; LEFT=[];
  for(const [dd,ps] of Object.entries(ALL)) for(const x of ps){
    const mv=MOVE[x.id];
    if(mv==='drop') continue;
    if(mv ? mv===DAY : dd===DAY) SINGLES.push(mv&&dd!==DAY?{...x,time:'',_moved:dd}:x);
    else if(!mv && DAY===today() && dd===yday && !done[x.id]) LEFT.push({...x,time:'',_left:dd});   // 前日の残り＝下に畳んで出す（自動では足さない）
  }
  // 引用は単独と同じカードで出す（time＝回の時刻・segs＝引用文・quote＝元）
  QUOTES = q ? JSON.parse(new TextDecoder().decode(await getBin(q.f))).map(x=>({id:x.id,k:(x.kind==='buzz'?'🟨バズ':'🟦リスト')+'　'+(x.label||x.acc),time:x.slot,segs:[x.text],imgs:x.imgs,quote:x})).filter(x=>MOVE[x.id]!=='drop') : [];
  render();
  // 画像は先に全部ほどいておく＝「Xで開く」を押した瞬間に渡せる（押した後に待つと iPhone が共有を止める）
  for(const p of SINGLES.concat(QUOTES)) for(const im of p.imgs.concat(p.quote&&p.quote.src_imgs||[])) loadImg(im);
}
// 本人「元投稿の画像が表示されない」＝上げた直後など1回失敗すると取り直していなかった。失敗したら3秒おきに3回、カードを開いた時もまた取りに行く
const LOADING={};
function loadImg(im,left=3){
  if(FILES[im.f]||LOADING[im.f]) return; LOADING[im.f]=1;
  getBin(im.f).then(buf=>{ FILES[im.f]=new File([buf],im.name,{type:'image/jpeg'}); document.querySelectorAll('[data-f="'+im.f+'"]').forEach(t=>t.src=URL.createObjectURL(FILES[im.f])); })
    .catch(()=>{ if(left>0) setTimeout(()=>{ delete LOADING[im.f]; loadImg(im,left-1); },3000); })
    .finally(()=>{ if(FILES[im.f]) delete LOADING[im.f]; });
}
function thumb(im){ if(!FILES[im.f]) loadImg(im); return $('img',{'data-f':im.f,alt:'',src:FILES[im.f]?URL.createObjectURL(FILES[im.f]):'',onclick:e=>{ if(!e.target.src) return; const o=$('div',{class:'big',onclick:()=>o.remove()},[$('img',{src:e.target.src,alt:''})]); document.body.appendChild(o); }}); }

// 本人「時間が来ても投稿できなかったら次自動で時間割り振り」：今日の次の1本が20分過ぎても出ていなければ、残りを今から組み直す
// 決め事は schedule_times.py と同じ＝前の投稿から45〜100分・分は5の倍数を避ける・リストイン同士は3時間あける
const toM=t=>{const [a,b]=(t||'99:99').split(':').map(Number);return a*60+b}, toT=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function sched(){
  const key='gp_sched_'+DAY, S=LS.get(key,{});
  const eff=p=>S[p.id]||p.time;
  // 回してきた本（時刻なし）は、その日の最後の本の後ろに45〜100分あけて置く
  const noT=SINGLES.filter(p=>!eff(p)&&!done[p.id]);
  if(noT.length){ let t=Math.max(DAY===today()?nowM():7*60+30, ...SINGLES.filter(p=>eff(p)).map(p=>toM(eff(p))))+45; noT.forEach(p=>{ while(t%5===0) t++; S[p.id]=toT(t); t+=45+Math.floor(Math.random()*56); }); LS.set(key,S); }
  if(DAY===today()){
    const rest=SINGLES.filter(p=>!done[p.id]).sort((a,b)=>toM(eff(a))-toM(eff(b)));
    if(rest.length && nowM()>toM(eff(rest[0]))+20){
      const doneT=SINGLES.filter(p=>done[p.id]).map(p=>toM(done[p.id]));
      let t=Math.max(nowM()+1, doneT.length?Math.max(...doneT)+45:0);
      let lastLi=Math.max(-1e9,...SINGLES.filter(p=>done[p.id]&&p.listin).map(p=>toM(done[p.id])));
      const pool=rest.slice();
      while(pool.length){
        let i=pool.findIndex(p=>!p.listin||t-lastLi>=180); if(i<0) i=0;
        const p=pool.splice(i,1)[0];
        while(t%5===0) t++;
        S[p.id]=toT(t); if(p.listin) lastLi=t;
        t+=45+Math.floor(Math.random()*56);
      }
      S._at=toT(nowM()); LS.set(key,S);
    }
  }
  if(DAY===today()) sendSched(eff);
  return eff;
}
// 本人「変わった時間で通知出せない？」：今日の残りの時刻をメモ欄へ（変わった時だけ）。PC の目覚ましが5分おきに読んで置き直す
let schedT=null;
function sendSched(eff){
  const by={}; const rows=[];
  SINGLES.slice().sort((a,b)=>toM(eff(a))-toM(eff(b))).forEach(p=>{ const m=/^\d+\s+(.+?)｜/.exec(p.k||''); const g=m?m[1]:'その他'; (by[g]=by[g]||[]).push(p); });
  Object.entries(by).forEach(([g,ps])=>ps.forEach((p,i)=>{ if(!done[p.id]&&eff(p)&&toM(eff(p))<1440) rows.push({id:p.id,time:eff(p),g:g+' '+(i+1)+'/'+ps.length,first:(p.segs[0]||'').split('\n')[0].slice(0,60)}); }));
  rows.sort((a,b)=>a.time<b.time?-1:1);
  const sig=JSON.stringify(rows.map(r=>r.id+r.time));
  if(LS.get('gp_sched_sig','')===DAY+sig) return;
  clearTimeout(schedT); schedT=setTimeout(async()=>{
    if(!CFG||!KEY||location.hostname==='127.0.0.1') return;
    try{
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify({day:DAY,at:new Date().toISOString(),rows}))));
      const all=new Uint8Array(12+ct.length); all.set(iv); all.set(ct,12); let bin=''; all.forEach(b=>bin+=String.fromCharCode(b));
      const r=await fetch('https://api.github.com/repos/'+CFG.repo+'/issues/'+CFG.issue+'/comments',{method:'POST',headers:{'Authorization':'Bearer '+CFG.token,'Accept':'application/vnd.github+json'},body:JSON.stringify({body:'gps1:'+btoa(bin)})});
      if(r.ok) LS.set('gp_sched_sig',DAY+sig);
    }catch(e){}
  },3000);
}
function list(){ return MODE==='quote'?QUOTES:SINGLES; }
function render(){
  const app=document.getElementById('app'); app.textContent='';
  const ds=Object.keys(IDX.days).sort().filter(d=>d>=today());   // 昨日のタブは出さない（本人「出ちゃうと分かりづらい」）。昨日の分は今日の下の「昨日の残り」だけ
  const eff = MODE==='quote' ? (p=>p.time) : sched();
  const L=list().slice().sort((a,b)=>toM(eff(a))-toM(eff(b)));
  // 本人「ジャンルも書いて欲しい　SNS 1/2 とか」「引用は元投稿のアカウント名も」
  if(MODE==='quote') L.forEach(p=>{ p._g=(p.quote.kind==='buzz'?'🟨 ':'🟦 ')+(p.quote.name||p.quote.acc); });
  else { const by={}; L.forEach(p=>{ const m=/^\d+\s+(.+?)｜/.exec(p.k||''); const g=m?m[1]:'その他'; (by[g]=by[g]||[]).push(p); });
    Object.entries(by).forEach(([g,ps])=>ps.forEach((p,i)=>{ p._g=g+' '+(i+1)+'/'+ps.length; })); }
  const n=L.length, k=L.filter(p=>done[p.id]).length;
  const nq=(IDX.quotes&&IDX.quotes[DAY]||{}).n||0;
  const tab=(m,lab)=>$('button',{class:'day'+(MODE===m?' sel':''),text:lab,onclick:()=>{MODE=m;LS.set('gp_mode',m);render();scrollTo(0,0);}});
  const top=$('div',{class:'top'},[
    $('div',{class:'bar'},[
      $('div',{class:'days'},ds.map(d=>$('button',{class:'day'+(d===DAY?' sel':''),text:(d===today()?'今日 ':'')+md(d),onclick:async()=>{DAY=d;LS.set('gp_day',d);await loadDay();}}))),
      $('button',{class:'icon',text:'更新',onclick:async e=>{e.target.textContent='…';try{IDX=await loadIndex();await loadDay();}catch(x){e.target.textContent='✕'}}})
    ]),
    $('div',{class:'bar'},[tab('single','単独 '+((IDX.days[DAY]||{}).n||0)+'本'),tab('quote','引用 '+nq+'本')]),
    $('div',{class:'prog'},[$('span',{},[$('b',{text:k+'/'+n}),' 本 済み']),$('div',{class:'meter'},[$('i',{style:'width:'+(n?k/n*100:0)+'%'})])])
  ]);
  app.appendChild(top);
  const S=LS.get('gp_sched_'+DAY,{});
  if(MODE==='single' && S._at) app.appendChild($('div',{class:'tag',text:'↻ '+S._at+' に、出せていない分の時刻を今から組み直しました'}));
  if(!n){ app.appendChild($('div',{class:'empty',text:MODE==='quote'?'この日の引用はまだありません（08:00・11:30・14:30・18:00・20:00 の回で届きます）':'この日の投稿はまだありません。予約表で「予約に入れる」を押した物がここに出ます'})); }
  const rest=L.filter(p=>!done[p.id]), fin=L.filter(p=>done[p.id]).sort((a,b)=>done[b.id]<done[a.id]?-1:1);
  const nx=rest[0]&&rest[0].id;
  rest.forEach(p=>app.appendChild(card(p,p.id===nx,eff(p))));
  if(fin.length){ app.appendChild($('div',{class:'sec',text:'投稿した（'+fin.length+'）'})); fin.forEach(p=>app.appendChild(card(p,false,eff(p)))); }
  if(MODE==='single' && LEFT.length){
    app.appendChild($('button',{class:'btn sub',text:(leftOpen?'▼ ':'▶ ')+'昨日の残り（出していない '+LEFT.length+'本）',onclick:()=>{leftOpen=!leftOpen;render();}}));
    if(leftOpen) LEFT.forEach(p=>app.appendChild(card(p,false,'')));

// 印：スマホに控え、置き場のメモ欄（GitHub の Issue）に鍵をかけて送る。PC の learn_loop.py が毎朝読む
let MARKS=LS.get('gp_marks',{}), CFG=null, sendT=null;
// 本人「行をタップ　そしたら何個か選べるやつ出てきたらいい」：弱い／AI感／合ってない／いらない／外す
const KINDS=['弱い','AI感','合ってない','いらない'];
function M(id){ const m=MARKS[id]||(MARKS[id]={lines:[],kinds:{},post:[],img:[],sent:false}); m.kinds=m.kinds||{}; m.post=m.post||[]; m.img=m.img||[]; return m; }
function markOf(id,ln){ const m=MARKS[id]; if(!m) return ''; if(m.kinds&&m.kinds[ln]) return m.kinds[ln]; return (m.lines||[]).includes(ln)?'弱い':''; }
const isMarked=(id,ln)=>!!markOf(id,ln);
function dirty(m){ m.sent=false; LS.set('gp_marks',MARKS); clearTimeout(sendT); sendT=setTimeout(sendMarks,4000); }
function setMark(id,ln,k){ const m=M(id); if(k){ m.kinds[ln]=k; if(!m.lines.includes(ln)) m.lines.push(ln); } else { delete m.kinds[ln]; m.lines=m.lines.filter(x=>x!==ln); } dirty(m); }
function toggleList(id,key,v){ const m=M(id); m[key]=m[key].includes(v)?m[key].filter(x=>x!==v):m[key].concat(v); dirty(m); return m[key].includes(v); }
// 本人「どこの行を選んでるかわからないから選んでる行色つかない？」「フックが弱いもつけて欲しい」「それで俺が言いたいこと意図できる？」
//   ＝選んでいる間は行に枠と色・1行目は「フックが弱い」を先頭に・ひとこと（任意）で意図を残す
function pickMark(id,ln,sp,isHook){
  const cur=markOf(id,ln), m0=MARKS[id]||{}, note0=(m0.notes||{})[ln]||'';
  const kinds=(isHook?['フックが弱い']:[]).concat(KINDS);
  sp.classList.add('sel');
  { const r=sp.getBoundingClientRect(); window.scrollBy({top:r.top-innerHeight*0.18,behavior:'smooth'}); }   // 下の選択肢に隠れないよう上へ
  const close=()=>{ sp.classList.remove('sel'); o.remove(); };
  const ta=$('textarea',{class:'note',placeholder:'ひとこと（書かなくてもいい）例：意味が逆／もっと具体の数字／言い切って'}); ta.value=note0;
  const setNote=()=>{ const m=M(id); m.notes=m.notes||{}; const v=ta.value.trim(); if(v) m.notes[ln]=v; else delete m.notes[ln]; };
  const o=$('div',{class:'sheet',onclick:e=>{ if(e.target===o){ if(cur&&ta.value.trim()!==note0){ setNote(); dirty(M(id)); } close(); } }},[$('div',{class:'sheetin'},[
    $('div',{class:'sheetln',text:ln}),
    ...kinds.map(k=>$('button',{class:'btn sub kb'+(cur===k?' on':''),'data-k':k,text:k,onclick:()=>{ setNote(); setMark(id,ln,k); sp.className='ln mk k'+kc(k); sp.dataset.k=k; close(); }})),
    ta,
    $('button',{class:'btn sub',text:cur?'印を外す':'閉じる',onclick:()=>{ if(cur){ const m=M(id); if(m.notes) delete m.notes[ln]; setMark(id,ln,''); sp.className='ln'; sp.dataset.k=''; } close(); }})])]);
  document.body.appendChild(o);
}
const kc=k=>k==='フックが弱い'?0:KINDS.indexOf(k);
async function sendMarks(){
  if(!CFG||!KEY||location.hostname==='127.0.0.1') return; const todo=Object.entries(MARKS).filter(([,m])=>!m.sent); if(!todo.length) return;
  try{
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify({at:new Date().toISOString(),marks:Object.fromEntries(todo.map(([id,m])=>[id,m.lines])),kinds:Object.fromEntries(todo.map(([id,m])=>[id,m.kinds||{}])),post:Object.fromEntries(todo.map(([id,m])=>[id,m.post||[]])),notes:Object.fromEntries(todo.map(([id,m])=>[id,m.notes||{}])),img:Object.fromEntries(todo.map(([id,m])=>[id,m.img||[]]))}))));
    const all=new Uint8Array(12+ct.length); all.set(iv); all.set(ct,12);
    let bin=''; all.forEach(b=>bin+=String.fromCharCode(b));
    const r=await fetch('https://api.github.com/repos/'+CFG.repo+'/issues/'+CFG.issue+'/comments',{method:'POST',headers:{'Authorization':'Bearer '+CFG.token,'Accept':'application/vnd.github+json'},body:JSON.stringify({body:'gpm1:'+btoa(bin)})});
    if(r.ok){ todo.forEach(([,m])=>m.sent=true); LS.set('gp_marks',MARKS); }
  }catch(e){}
}
const VAPID='BG3ovvXhHy_tRwN6PgOeR9K2sTNx6JH89wtin5Rii79QZoXRSnNOQjm8smQNkgb4gqk-bXQvaxnOQGXm03OoXHM';
function notifBox(){
  const box=$('div',{class:'foot'});
  const st=('Notification' in window)?Notification.permission:'none';
  if(LS.get('gp_sub',null) && st==='granted'){ box.append($('div',{text:'通知：オン（投稿の時刻・引用ができた時）'}), $('button',{class:'more',text:'送り先の文字をもう一度出す',onclick:()=>showSub(LS.get('gp_sub',''))})); return box; }
  if(!('PushManager' in window)){ box.textContent='通知はホーム画面のアイコンから開いた時だけ使えます'; return box; }
  box.appendChild($('button',{class:'btn sub',text:'通知をオン',onclick:async e=>{
    try{
      const p=await Notification.requestPermission(); if(p!=='granted'){ e.target.textContent='許可されませんでした（設定→通知→投稿 で許可）'; return; }
      const reg=await navigator.serviceWorker.ready;
      const key=Uint8Array.from(atob(VAPID.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-VAPID.length%4)%4)),c=>c.charCodeAt(0));
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
      const code=btoa(JSON.stringify(sub.toJSON())); LS.set('gp_sub',code); showSub(code);
    }catch(x){ e.target.textContent='できませんでした：'+(x&&x.message||x); }
  }}));
  return box;
}
function showSub(code){
  const o=$('div',{class:'big',style:'flex-direction:column;gap:12px;padding:24px'},[
    $('div',{style:'color:#fff;font-size:16px;text-align:center',text:'下の文字をコピーして、Claude に「通知の送り先」と言って貼ってください（1回だけ）'}),
    $('textarea',{style:'width:100%;height:30vh;font-size:12px',readonly:''}),
    $('button',{class:'btn',text:'コピー',onclick:()=>{ try{navigator.clipboard.writeText(code)}catch(x){} }}),
    $('button',{class:'btn sub',style:'color:#fff',text:'閉じる',onclick:()=>o.remove()})]);
  o.querySelector('textarea').value=code; document.body.appendChild(o);
}

function card(p,isNext,tm){
  tm=tm||p.time;
  const isDone=!!done[p.id];
  const isOpen = open[p.id]!=null ? open[p.id] : isNext;
  const c=$('section',{class:'card'+(isNext?' next':'')+(isDone?' done':''),id:'c-'+p.id});
  const first=(p.segs[0]||'').split('\n')[0];
  const head=$('div',{class:'ch',onclick:()=>{open[p.id]=!isOpen;render();}},[
    $('div',{class:'tm'+(tm?'':' none'),text:!tm?'時刻なし':toM(tm)>=1440?'明日へ':tm}),
    $('div',{class:'mid'},[$('div',{class:'gen',text:p._g||''}),$('div',{class:'one',text:first})]),
    isDone?$('span',{class:'chk',text:'✓ '+done[p.id]}):$('span',{class:'tag',text:(p.segs.length>1?'ツリー'+p.segs.length+'段・':'')+(p.imgs.length?'画像'+p.imgs.length:'文字だけ')})
  ]);
  c.appendChild(head);
  if(!isOpen) return c;
  const body=$('div',{class:'cb'});
  if(p.k) body.appendChild($('div',{class:'tag',text:p.k}));
  // 本人「そもそもネタが弱いときはどうする？」＝投稿まるごとの印
  const chip=(key,v)=>{ const on=!!(MARKS[p.id]&&(MARKS[p.id][key]||[]).includes(v)); return $('button',{class:'chip'+(on?' on':''),text:v,onclick:e=>{ e.target.classList.toggle('on',toggleList(p.id,key,v)); }}); };
  if(!p.quote) body.appendChild($('div',{class:'chips'},[$('span',{class:'hint',text:'この投稿：'}),chip('post','フックが弱い'),chip('post','ネタが弱い'),chip('post','いい')]));
  else body.appendChild($('div',{class:'chips'},[$('span',{class:'hint',text:'この引用：'}),chip('post','フックが弱い'),chip('post','角度が弱い'),chip('post','いい')]));
  // 次の1本は「あと◯分」を出す（今日だけ）。23:30 を過ぎる本は明日に回してもいい
  if(isNext && DAY===today() && tm && !p.quote){ const d=toM(tm)-nowM(); body.appendChild($('div',{class:'when',text:d>0?'あと'+(d>=60?Math.floor(d/60)+'時間':'')+(d%60)+'分（'+tm+'）':'今出す'})); }
  if(!p.quote && toM(tm)>23*60+30 && toM(tm)<99*60) body.appendChild($('div',{class:'msg err',text:toM(tm)>=1440?'今日のうちに入りません。明日に回すか、すぐ出してください':'23:30 を過ぎます。明日に回してもいいです'}));
  if(p.quote){
    // 本人「元投稿もちゃんと見れるようにしたい　今のディスコード形式を見やすくした版」＝元は X のカードの形で全文と画像まで
    const q=p.quote;
    const when=q.created?new Date(q.created*1000):null;
    const meta=[q.likes!=null?'♥ '+Number(q.likes).toLocaleString():'', q.views!=null?'表示 '+Number(q.views).toLocaleString():'', when?(when.getMonth()+1)+'/'+when.getDate()+' '+String(when.getHours()).padStart(2,'0')+':'+String(when.getMinutes()).padStart(2,'0'):''].filter(Boolean).join('　');
    body.appendChild($('div',{class:'sec2',text:'▶ 元投稿'}));
    const card2=$('div',{class:'xcard'},[
      $('div',{class:'xwho'},[$('b',{text:q.name||q.acc}),$('span',{text:' '+q.acc})]),
      $('div',{class:'txt',text:q.src||'（元の本文なし）'}),
      (q.src_imgs||[]).length?$('div',{class:'thumbs'+(q.src_imgs.length>1?' n2':'')},q.src_imgs.map(im=>thumb(im))):null,
      $('div',{class:'xmeta'},[$('span',{text:meta}),$('a',{class:'more',href:q.url,target:'_blank',rel:'noopener',text:'X で開く ↗'})])
    ]);
    body.appendChild(card2);
    body.appendChild($('div',{class:'sec2',text:'▼ 引用文'}));
  }
  // 本人「画像ちっちゃい」：1枚は横幅いっぱい・2枚以上は2列。押すと全画面
  const myImgs=()=>$('div',{class:'thumbs'+(p.imgs.length>1?' n2':'')},p.imgs.map(im=>thumb(im)));
  const imgChips=()=>$('div',{class:'chips'},[$('span',{class:'hint',text:'画像：'}),chip('img','止まらない'),chip('img','伝わらない')]);
  if(p.imgs.length && !p.quote){ body.appendChild(myImgs()); body.appendChild(imgChips()); }
  const msg=$('div',{class:'msg'});
  const files=()=>p.imgs.map(im=>FILES[im.f]).filter(Boolean);
  // ツリーは「1段目 → Xで開く → 2段目以降をコピー」の順（出す順に上から押すだけ）
  const main=$('div',{class:'btns'},[
    $('button',{class:'btn',text:'Xで開く',onclick:()=>openX(p,files(),msg)}),
  ]);
  const subs=$('div',{class:'btns'},[
    $('button',{class:'btn sub',text:p.quote?'引用文をコピー':p.segs.length>1?'1段目をコピー':'本文をコピー',onclick:()=>copy(p.segs[0],msg,p.segs.length>1?'1段目':'本文')}),
    p.imgs.length?$('button',{class:'btn sub',text:'画像を保存',onclick:()=>saveImgs(files(),msg)}):null
  ]);
  p.segs.forEach((s,i)=>{
    const seg=$('div',{class:'seg'});
    if(p.segs.length>1) seg.appendChild($('div',{class:'sl',text:(i+1)+'段目'+(i===0?'（最初の投稿）':'（自分の投稿に返信で）')}));
    // 本人「印いいよ　アプリのほうがわかりやすい」：直したいけど『まぁいいか』で出す行は、タップで印（直さなくていい）
    const tx=$('div',{class:'txt'+(s.length>140?' fold':'')}); seg.appendChild(tx);
    s.split('\n').forEach((ln,j,arr)=>{ const k0=markOf(p.id,ln); const sp=$('span',{class:'ln'+(k0?' mk k'+kc(k0):''),'data-k':k0,text:ln}); const hook=(i===0&&j===s.split('\n').findIndex(x=>x.trim())); if(ln.trim()) sp.addEventListener('click',e=>{ e.stopPropagation(); pickMark(p.id,ln,sp,hook); }); tx.appendChild(sp); if(j<arr.length-1) tx.appendChild(document.createTextNode('\n')); });
    if(i===0) seg.appendChild($('div',{class:'hint',text:'気になる行はタップして種類を選ぶ（直さなくていい）'}));
    if(s.length>140) seg.appendChild($('button',{class:'more',text:'全文を見る',onclick:e=>{tx.classList.toggle('fold');e.target.textContent=tx.classList.contains('fold')?'全文を見る':'たたむ';}}));
    if(i>0) seg.appendChild($('div',{class:'btns'},[$('button',{class:'btn sub',text:(i+1)+'段目をコピー',onclick:()=>copy(s,msg,(i+1)+'段目')})]));
    body.appendChild(seg);
    if(i===0){ if(p.quote) body.append($('div',{class:'sec2',text:'▼ 画像'}), p.imgs.length?myImgs():$('div',{class:'tag',text:'画像なし'}), p.imgs.length?imgChips():''); body.append(main,subs); }
  });
  // 明日に回す／今回は出さない（出していない本だけ）
  const tmr=(()=>{ const d=new Date(DAY+'T00:00:00'); d.setDate(d.getDate()+1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();
  const moveRow=isDone?null:$('div',{class:'btns'},[
    p.quote?null:p._left?$('button',{class:'btn sub',text:'今日に回す',onclick:async()=>{ MOVE[p.id]=DAY; LS.set('gp_move',MOVE); await loadDay(); }}):$('button',{class:'btn sub',text:'明日に回す',onclick:async()=>{ MOVE[p.id]=tmr; LS.set('gp_move',MOVE); await loadDay(); }}),
    $('button',{class:'btn sub',text:'今回は出さない',onclick:async()=>{ MOVE[p.id]='drop'; LS.set('gp_move',MOVE); await loadDay(); }})]);
  if(p._moved||p._left) body.insertBefore($('div',{class:'when',text:md(p._moved||p._left)+(p._left?' に出していない本':' から回してきた本')}),body.firstChild);
  const mark=$('button',{class:'btn '+(isDone?'undo':'done'),text:isDone?'投稿したを取り消す':'投稿した',onclick:()=>{
    if(isDone) delete done[p.id]; else { const d=new Date(); done[p.id]=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); open[p.id]=false; }
    LS.set('gp_done',done); render(); if(!isDone){ const nx=document.querySelector('.card.next'); if(nx) nx.scrollIntoView({behavior:'smooth',block:'start'}); }
  }});
  body.append($('div',{class:'btns'},[mark]),moveRow||'',msg);
  c.appendChild(body);
  return c;
}

function copy(t,msg,lab){
  const ok=()=>{msg.className='msg';msg.textContent=lab+'をコピーしました（'+t.length+'字）'};
  try{ navigator.clipboard.writeText(t).then(ok,()=>{msg.className='msg err';msg.textContent='コピーできませんでした'}); }catch(e){ msg.className='msg err'; msg.textContent='コピーできませんでした'; }
}
// 本文はコピーもしておく＝X が本文を落とした時は長押しで貼るだけ。share は押したその場で呼ぶ（await を挟むと iPhone が止める）
function openX(p,fs,msg){
  // 引用は最後に元の URL を付けて渡す＝X がその投稿の引用にする
  const t=p.quote ? p.segs[0]+'\n'+p.quote.url : p.segs[0];
  try{ navigator.clipboard.writeText(t).catch(()=>{}); }catch(e){}
  if(p.imgs.length && fs.length<p.imgs.length){ msg.className='msg err'; msg.textContent='画像を読み込み中です。2〜3秒待ってもう一度押してください'; return; }
  const data=fs.length?{files:fs,text:t}:{text:t};
  if(navigator.share && (!fs.length || (navigator.canShare&&navigator.canShare({files:fs})))){
    navigator.share(data).then(()=>{msg.className='msg';msg.textContent='X で出したら「投稿した」を押してください（本文はコピー済み。抜けていたら貼り付け）'}).catch(e=>{ if(e&&e.name==='AbortError') return; msg.className='msg err'; msg.textContent='共有できませんでした。「本文をコピー」と「画像を保存」で出してください'; });
  } else {
    location.href='https://x.com/intent/post?text='+encodeURIComponent(t);
  }
}
function saveImgs(fs,msg){
  if(!fs.length){ msg.className='msg err'; msg.textContent='画像を読み込み中です'; return; }
  if(navigator.share && navigator.canShare && navigator.canShare({files:fs})){ navigator.share({files:fs}).catch(()=>{}); }
  else fs.forEach(f=>{ const a=$('a',{href:URL.createObjectURL(f),download:f.name}); document.body.appendChild(a); a.click(); a.remove(); });
}
